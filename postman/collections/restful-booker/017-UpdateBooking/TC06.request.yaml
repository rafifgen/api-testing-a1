$kind: http-request
name: TC06
description: |-
  **Deskripsi:**  
  Menguji respons server saat melakukan pembaruan data booking (`PUT`) dengan ID booking  
  yang bukan angka (`abc`) pada parameter URL, menggunakan autentikasi _Basic Auth_ yang valid.

  **Expected Result:**  
  Status `405 Method Not Allowed` — server menolak permintaan karena format ID tidak valid,  
  dan data booking tidak berubah di _database_.
url: https://restful-booker.herokuapp.com/booking/abc
method: PUT
body:
  type: json
  content: "{\r

    \    \"firstname\" : \"James\",\r

    \    \"lastname\" : \"Brown\",\r

    \    \"totalprice\" : 111,\r

    \    \"depositpaid\" : true,\r

    \    \"bookingdates\" : {\r

    \    \"checkin\" : \"2018-01-01\",\r

    \    \"checkout\" : \"2019-01-01\"\r

    \    },\r

    \    \"additionalneeds\" : \"Breakfast\"\r

    }"
auth:
  type: basic
  credentials:
    username: admin
    password: password123
examples: .resources/TC06.resources/examples
order: 6000
