$kind: http-request
name: TC04
description: |-
  **Deskripsi:**  
  Menguji respons server saat melakukan pembaruan data booking (`PUT`) menggunakan metode  
  autentikasi _Basic Auth_ dengan kredensial yang valid (`admin`/`password123`). ID booking  
  yang digunakan (`1`) diasumsikan ada di dalam _database_.

  **Expected Result:**  
  Status `200 OK` — server berhasil memverifikasi kredensial dan memperbarui data booking,  
  mengembalikan objek booking yang telah diperbarui.
url: https://restful-booker.herokuapp.com/booking/1
method: PUT
body:
  type: json
  content: "{\r

    \    \"firstname\" : \"James\",\r

    \    \"lastname\" : \"Brown\",\r

    \    \"totalprice\" : 111,\r

    \    \"depositpaid\" : true,\r

    \    \"bookingdates\" : {\r

    \        \"checkin\" : \"2018-01-01\",\r

    \        \"checkout\" : \"2019-01-01\"\r

    \    },\r

    \    \"additionalneeds\" : \"Breakfast\"\r

    }"
auth:
  type: basic
  credentials:
    username: admin
    password: password123
examples: .resources/TC04.resources/examples
order: 4000
