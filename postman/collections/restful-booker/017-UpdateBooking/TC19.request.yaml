$kind: http-request
name: TC19
description: |-
  **Deskripsi:**  
  Menguji respons server saat melakukan pembaruan data booking (`PUT`) dengan nilai `checkin`  
  (`2020-01-01`) yang lebih baru dari `checkout` (`2019-01-01`), sehingga logika tanggal  
  tidak valid, menggunakan autentikasi _Basic Auth_ yang valid.

  **Expected Result:**  
  Status `400 Bad Request` — server menolak permintaan karena terdapat inkonsistensi logika  
  tanggal antara `checkin` dan `checkout`, disertai pesan error, dan data booking tidak  
  berubah di _database_.
url: https://restful-booker.herokuapp.com/booking/2
method: PUT
body:
  type: json
  content: "{\r

    \    \"firstname\" : \"James\",\r

    \    \"lastname\" : \"Brown\",\r

    \    \"totalprice\" : 111,\r

    \    \"depositpaid\" : false,\r

    \    \"bookingdates\" : {\r

    \        \"checkin\" : \"2020-01-01\",\r

    \        \"checkout\" : \"2019-01-01\"\r

    \    }\r

    }"
auth:
  type: basic
  credentials:
    username: admin
    password: password123
