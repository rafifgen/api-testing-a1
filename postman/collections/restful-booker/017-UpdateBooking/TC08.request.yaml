$kind: http-request
name: TC08
description: |-
  **Deskripsi:**  
  Menguji keberhasilan pembaruan data booking (`PUT`) dengan nilai `depositpaid` diisi `false`,  
  menggunakan autentikasi _Basic Auth_ yang valid. ID booking yang digunakan (`2`) diasumsikan  
  ada di dalam _database_.

  **Expected Result:**  
  Status `200 OK` — server berhasil memperbarui data booking, response body berisi JSON data  
  booking yang telah diperbarui, dan perubahan tersimpan di _database_.
url: https://restful-booker.herokuapp.com/booking/2
method: PUT
body:
  type: json
  content: "{\r

    \    \"firstname\" : \"James\",\r

    \    \"lastname\" : \"Brown\",\r

    \    \"totalprice\" : 111,\r

    \    \"depositpaid\" : false,\r

    \    \"bookingdates\" : {\r

    \        \"checkin\" : \"2018-01-01\",\r

    \        \"checkout\" : \"2019-01-01\"\r

    \    },\r

    \    \"additionalneeds\" : \"Breakfast\"\r

    }"
auth:
  type: basic
  credentials:
    username: admin
    password: password123
examples: .resources/TC08.resources/examples
order: 8000
