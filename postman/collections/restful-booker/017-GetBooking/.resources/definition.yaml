name: 017-GetBooking
description: |-
  **Deskripsi Modul**

  Modul ini berisi rangkaian pengujian untuk _endpoint_ `GET /booking/:id`. _Endpoint_ ini berfungsi untuk mengambil detail informasi pemesanan (seperti nama, harga, status deposit, dan tanggal _check-in_/_check-out_) berdasarkan ID pemesanan yang valid.

  Pengujian pada modul ini difokuskan pada pemanggilan ID yang valid (Positif), penanganan eror jika ID tidak ditemukan atau formatnya salah (Negatif), serta pengujian negosiasi konten (_content negotiation_) melalui _header_ `Accept`.

  ---

  **Prasyarat Pengujian (Pre-Conditions)**

  Beberapa skenario positif membutuhkan data _booking_ yang sudah dipastikan ada di _database_. Eksekutor harus menjalankan _request_ prasyarat (seperti `Pre-TC04`, `Pre-TC05`, dst.) terlebih dahulu. Respons dari _request_ tersebut akan menghasilkan `bookingid` baru, yang kemudian disalin ke dalam parameter URL pada _test case_ utama.
